service:
  host: "0.0.0.0"
  port: 8080

logging:
  backend: "stderr"
  level: "debug"
  ident: "video_sentinel_dev"

inference:
  backend: "ascendcl"
  model_path: "/root/Documents/github/SentinelEdge/build/board-native-debug-package/models/yolo/yolo26n_aipp_nv12.om"
  device_id: 0

preprocess:
  output_width: 640
  output_height: 640
  output_layout: "NV12"
  output_dtype: "UINT8"
  normalize: false

postprocess:
  model_type: "yolo"
  output_layout: "channels_first"
  num_classes: 80
  confidence_threshold: 0.25
  nms_iou_threshold: 0.45
  max_detections: 100
  merge_coco_vehicles: true

overlay:
  enabled: true

output:
  video_sink: "mjpeg"
  debug_image_dir: "debug/frames"
  debug_image_interval: 1
  mjpeg_host: "0.0.0.0"
  mjpeg_port: 8081
  mjpeg_path: "/stream"
  mjpeg_quality: 80
  mjpeg_max_clients: 4

performance:
  enabled: true
  log_interval_frames: 30
  csv_path: "perf/dev-pipeline.csv"

runtime:
  data_dir: "./data/dev"

pipeline:
  backend: "dvpp"
  mode: "threaded"
  max_frames: 300
  detect_fps: 30
  stream_slots: 2
  output_queue_size: 2

mqtt:
  enabled: true
  host: "45.62.109.151"
  port: 1883
  client_id: "device_001"
  username: "admin"
  password: "taozhen666."
  heartbeat_interval_s: 30
